<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <title>Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1> Lista de Produtos</h1>
    </header>
    <main>
        <!-- Seção 1: Cadastro de produtos -->
        <section id="secao-cadastro">
            <h2>Cadastrar Produto</h2>
            <form id="form-produto">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" required></textarea>
                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" name="preco" step="0.01" min="0" required> <button
                    type="submit">Cadastrar</button>
            </form>
            <p id="mensagem-status"></p>
        </section>
        <!-- Seção 2: Listagem e exclusão de produtos -->
        <section id="secao-lista">
            <h2>Produtos Cadastrados</h2>
            <ul id="lista-produtos">
                <!-- Os produtos serão inseridos aqui via JavaScript -->
            </ul>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
